[workspace]
resolver = "2"
members = [
    "crates/nexus-cfdi",
    "crates/nexus-core",
    "crates/nexus-crm",
    "crates/nexus-inventory",
    "crates/nexus-ledger",
    "crates/nexus-pos",
    "crates/nexus-sale",
    "crates/nexus-search",
    "app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["ID & Barcode Solutions <dev@nexustechnologies.com.mx>"]
license = "MIT"

[workspace.dependencies]
# Runtime
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "compression-gzip"] }

# Serialización
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Base de datos
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio", "uuid", "chrono", "rust_decimal"] }

# CFDI / Criptografía
ring = "0.17"
quick-xml = { version = "0.36", features = ["serialize"] }
base64 = "0.22"

# Contabilidad
cala-ledger = "0.15"

# HTTP client
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }

# Tipos
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = { version = "1", features = ["serde"] }

# Caché
redis = { version = "0.25", features = ["tokio-comp"] }
moka = { version = "0.12", features = ["future"] }

# Templates
askama = "0.12"

# Search
meilisearch-sdk = "0.27"

# Email
lettre = { version = "0.11", features = ["tokio1", "tokio1-rustls-tls"] }

# PDF (representación impresa CFDI)
printpdf = "0.7"
image = { version = "0.25", features = ["png", "jpeg"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Errores
anyhow = "1"
thiserror = "2"

# Config
dotenvy = "0.15"

# Auth
jsonwebtoken = "9"
argon2 = "0.5"
async-trait = "0.1"

# Crypto extra
pbkdf2 = { version = "0.12", features = ["hmac"] }
